<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-LUMO PROMAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui}
header{position:fixed;top:0;left:0;right:0;z-index:99;background:#000;display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #222}
header h1{color:#00ffcc;font-size:17px}
#feed{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;height:100vh;padding-top:48px}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;min-width:100vw;height:calc(100vh - 48px);scroll-snap-align:start;background:#111;flex-shrink:0}
.reel video,.reel img{width:100%;height:100%;object-fit:cover;display:block}
.info{position:absolute;bottom:0;left:0;right:70px;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.user{font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center}
.user img{width:34px;height:34px;border-radius:50%;border:2px solid #00ffcc}
.cap{font-size:13px;margin-top:5px}
.actions{position:absolute;right:8px;bottom:90px;display:flex;flex-direction:column;gap:16px}
.btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid #444;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.btn span{font-size:22px}
.btn label{font-size:8px;color:#fff;margin-top:2px}
.btn.follow{background:#00ffcc;color:#000;font-weight:900}
.btn.follow.following{background:#fff;color:#000}
.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#00ffcc;color:#000;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:800;z-index:99}
</style></head><body>
<header><h1>G-LUMO PROMAX</h1><span style="font-size:11px;color:#aaa">← Scroll → TikTok</span><button onclick="location.reload()" style="background:#00ffcc;border:0;padding:6px 10px;border-radius:8px;font-weight:800">↻</button></header>
<div id="feed"></div>
<div class="hint">👉 Swipe LEFT / RIGHT</div>
<script>
const data=[
{type:'image',src:'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=700',user:'@g_lumo',name:'G-LUMO',cap:'🔥 G-LUMO PROMAX LIVE! Left-Right Scroll TikTok Duplicate • Follow • Download • Instagram',music:'♫ G-LUMO Sound'},
{type:'video',src:'https://www.w3schools.com/html/mov_bbb.mp4',user:'@pochi',name:'Pochi',cap:'M-Pesa 0142550440 Buyer +5% Fee, Seller -5% Payout ✅',music:'♫ Pochi Sound'},
{type:'image',src:'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=700',user:'@kenya',name:'Kenya Style',cap:'Photos scroll same as videos 📸 Download + Instagram button',music:'♫ Photo vibe'},
{type:'video',src:'https://www.w3schools.com/html/movie.mp4',user:'@market',name:'Market',cap:'Post products to market 🛒 Fee auto-calc',music:'♫ Business'},
{type:'image',src:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=700',user:'@travel',name:'Travel KE',cap:'Nairobi 🌃 Follow for more',music:'♫ Night'}
];
let following={};
function render(){
let f=document.getElementById('feed');f.innerHTML='';
data.forEach((d,i)=>{
let m=d.type==='video'?`<video src="${d.src}" loop muted playsinline autoplay></video>`:`<img src="${d.src}">`;
let ft=following[i]?'Following':'Follow';
let fc=following[i]?'btn follow following':'btn follow';
f.innerHTML+=`<div class="reel">${m}<div class="info"><div class="user"><img src="https://i.pravatar.cc/100?img=${i+5}">${d.name} • ${d.user}</div><div class="cap">${d.cap}</div><div style="color:#00ffcc;font-size:11px;margin-top:4px">${d.music}</div></div><div class="actions"><button class="${fc}" onclick="follow(${i})"><span>👤</span><label>${ft}</label></button><button class="btn" onclick="this.style.background='#ff0050'"><span>❤️</span><label>Like</label></button><button class="btn" onclick="downloadMedia('${d.src}')"><span>⬇️</span><label>Download</label></button><button class="btn" onclick="ig('${d.src}')"><span>📸</span><label>Instagram</label></button></div></div>`;
});
setTimeout(()=>{document.querySelectorAll('video').forEach(v=>{v.play().catch(()=>{});v.muted=false;});},500);
}
function follow(i){following[i]=!following[i];render();}
function downloadMedia(s){let a=document.createElement('a');a.href=s;a.download='g-lumo-'+Date.now();document.body.appendChild(a);a.click();a.remove();alert('Downloaded 📥');}
function ig(s){navigator.clipboard.writeText(s);window.open('https://instagram.com','_blank');alert('Link copied for Instagram 📸');}
render();
</script>
</body></html>

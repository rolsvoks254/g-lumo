<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-LUMO WORLD PROMAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:100;background:#000;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;height:36px;border-bottom:1px solid #222}
header h1{color:#00ffcc;font-size:13px}
/* MARKET TOP BAR - EXACTLY YOUR WHITE RECTANGLE - ONLY FIT HERE */
#marketTopBar{position:fixed;top:36px;left:0;right:0;z-index:99;height:44px;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);border-bottom:1px solid #222;display:flex;align-items:center;gap:8px;padding:0 8px;overflow-x:auto;white-space:nowrap}
#marketTopBar::-webkit-scrollbar{display:none}
.marketBtn{flex-shrink:0;padding:6px 10px;border-radius:20px;border:1px solid #00ffcc;background:rgba(0,255,204,.12);color:#00ffcc;font-size:10px;font-weight:800;cursor:pointer}
.marketBtn.buy{background:#00ffcc;color:#000}
.marketBtn.active{background:#fff;color:#000;border-color:#fff}
.marketInfo{flex-shrink:0;font-size:10px;color:#aaa}
.marketInfo b{color:#00ffcc}
#feed{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;height:100vh;padding-top:80px;padding-bottom:10px}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;min-width:100vw;width:100vw;height:calc(100vh - 80px);scroll-snap-align:center;flex-shrink:0;background:#0a0a0a}
.reel img,.reel video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:0;left:0;right:70px;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.userRow{display:flex;gap:6px;align-items:center;font-weight:800;font-size:13px}
.userRow img{width:30px;height:30px;border-radius:50%;border:2px solid #00ffcc}
.cap{font-size:12px;margin-top:4px}
.actions{position:absolute;right:4px;bottom:80px;display:flex;flex-direction:column;gap:12px}
.act{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid #444;display:flex;flex-direction:column;align-items:center;justify-content:center}
.act span{font-size:18px}
.act label{font-size:7px;color:#fff}
.act.follow{background:#00ffcc;color:#000;font-weight:900}
.act.follow.following{background:#fff}
.hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:#00ffcc;color:#000;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:900;z-index:99}
/* MARKET POPUP - ALSO ONLY IN SAME TOP STRIP AREA WHEN EXPANDED */
#marketPopup{position:fixed;top:36px;left:0;right:0;z-index:98;background:#111;border-bottom:2px solid #00ffcc;display:none;max-height:320px;overflow:auto;padding:8px}
#marketPopup.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.card{background:#000;border:1px solid #222;border-radius:10px;overflow:hidden}
.card img{width:100%;height:90px;object-fit:cover}
.cardBody{padding:6px}
.cardBody h4{font-size:11px}
.price{font-size:11px;color:#00ffcc;font-weight:900}
.small{font-size:9px;color:#aaa}
.input{width:100%;padding:8px;border-radius:6px;border:1px solid #333;background:#000;color:#fff;margin:4px 0;font-size:11px}
</style>
</head>
<body>

<header>
<h1>G-LUMO WORLD 🌍</h1>
<span style="font-size:9px;color:#aaa">← Scroll →</span>
</header>

<!-- THIS IS YOUR WHITE RECTANGLE - MARKET OPTIONS ONLY FIT HERE -->
<div id="marketTopBar">
<button class="marketBtn buy" onclick="toggleMarket()">🛒 MARKET BEST</button>
<button class="marketBtn" onclick="toggleSell()">+ Sell</button>
<div class="marketInfo">Pochi <b>0142550440</b></div>
<div class="marketInfo">Buyer <b>+5%</b> • Seller <b>-5%</b> • Fee to <b>0142550440</b></div>
<button class="marketBtn" onclick="buyNow()">Buy via 0142550440</button>
<div class="marketInfo" style="color:#00ffcc">Beats all platforms</div>
</div>

<!-- POPUP ALSO SLIDES FROM SAME TOP AREA - NOT FULL SCREEN - ONLY FITS WHITE RECTANGLE + SLIGHT EXPAND -->
<div id="marketPopup">
<div style="display:flex;justify-content:space-between;align-items:center">
<b style="font-size:12px;color:#00ffcc">🛒 World Best Market - 0142550440 Pochi</b>
<button onclick="toggleMarket()" style="background:#222;color:#fff;border:0;padding:4px 8px;border-radius:6px;font-size:10px">X Close</button>
</div>
<div style="background:#000;border:1px solid #222;border-radius:8px;padding:6px;margin-top:6px">
<input id="pName" class="input" placeholder="Product name">
<input id="pPrice" class="input" type="number" placeholder="Price KSH" oninput="calcFee()">
<div id="feePreview" style="font-size:10px;color:#00ffcc"></div>
<button onclick="addProduct()" style="width:100%;padding:8px;background:#00ffcc;color:#000;border:0;border-radius:6px;font-weight:900;font-size:11px;margin-top:4px">Post Product</button>
</div>
<div id="productGrid" class="grid"></div>
</div>

<div id="feed"></div>
<div class="hint">Swipe LEFT / RIGHT</div>

<script>
let marketOpen=false;
function toggleMarket(){marketOpen=!marketOpen;document.getElementById('marketPopup').classList.toggle('show',marketOpen)}
function toggleSell(){marketOpen=true;document.getElementById('marketPopup').classList.add('show');document.getElementById('pName').focus()}
function buyNow(){alert('Buyer: Send Total (Price+5%) to Pochi La Biashara 0142550440\nSeller gets Price-5%\nCommission to 0142550440')}

const data=[
{type:'image',src:'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800',user:'@g_lumo',name:'G-LUMO World',cap:'Swipe left right • No watermark'},
{type:'video',src:'https://www.w3schools.com/html/mov_bbb.mp4',user:'@pochi254',name:'Pochi 0142550440',cap:'M-Pesa 0142550440 Buyer +5% Seller -5% • Fee to 0142550440'},
{type:'image',src:'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800',user:'@kenya',name:'Kenya',cap:'Like Share Message Download Follow'},
{type:'video',src:'https://www.w3schools.com/html/movie.mp4',user:'@market',name:'Market BEST',cap:'World Best Market beats all'},
{type:'image',src:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800',user:'@travel',name:'Travel',cap:'Market options only in top strip'}
];
let following={},liked={};
function render(){
let f=document.getElementById('feed');f.innerHTML='';
data.forEach((d,i)=>{
let m=d.type==='video'?`<video src="${d.src}" loop muted playsinline autoplay></video>`:`<img src="${d.src}">`;
let ft=following[i]?'Following':'Follow';let fc=following[i]?'act follow following':'act follow';let lk=liked[i]?'❤️':'🤍';
f.innerHTML+=`<div class="reel">${m}<div class="info"><div class="userRow"><img src="https://i.pravatar.cc/100?img=${i+10}">${d.name} • ${d.user}</div><div class="cap">${d.cap}</div></div><div class="actions"><button class="${fc}" onclick="follow(${i})"><span>👤</span><label>${ft}</label></button><button class="act" onclick="like(${i})"><span>${lk}</span><label>Like</label></button><button class="act"><span>💬</span><label>Message</label></button><button class="act" onclick="navigator.clipboard.writeText('${d.src}');alert('Copied 🔗')"><span>🔗</span><label>Share</label></button><button class="act" onclick="let a=document.createElement('a');a.href='${d.src}';a.download='g-lumo';a.click()"><span>⬇️</span><label>Download</label></button></div></div>`;
});
}
function follow(i){following[i]=!following[i];render()}
function like(i){liked[i]=!liked[i];render()}

let products=[
{name:'Jordan',price:3500,img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400'},
{name:'iPhone',price:85000,img:'https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?w=400'}
];
function calcFee(){let p=parseFloat(document.getElementById('pPrice').value)||0;if(!p){document.getElementById('feePreview').innerHTML='';return}let buyer=p*1.05,seller=p*0.95;document.getElementById('feePreview').innerHTML=`Buyer KSH ${buyer.toFixed(0)} | You get KSH ${seller.toFixed(0)} | Fee to 0142550440`}
function renderMarket(){let g=document.getElementById('productGrid');g.innerHTML='';products.forEach((p,i)=>{g.innerHTML+=`<div class="card"><img src="${p.img}"><div class="cardBody"><h4>${p.name}</h4><div class="price">KSH ${p.price}</div><div class="small">Buyer +5% Seller -5% to 0142550440</div></div></div>`})}
function addProduct(){let n=document.getElementById('pName').value.trim();let pr=parseFloat(document.getElementById('pPrice').value);if(!n||!pr){alert('Enter name price');return}products.unshift({name:n,price:pr,img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'});renderMarket();document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('feePreview').innerHTML=''}
render();renderMarket();
</script>
</body>
</html>

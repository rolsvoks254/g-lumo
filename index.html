<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-LUMO WORLD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:100;background:#000;height:32px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid #222}
header h1{color:#00ffcc;font-size:12px}
/* WHITE RECTANGLE YOU DREW - NOW SOLID WHITE SO YOU WILL SEE IT */
#marketTopBar{position:fixed;top:32px;left:0;right:0;z-index:99;height:44px;background:#ffffff;display:flex;align-items:center;gap:6px;padding:0 6px;overflow-x:auto;border-bottom:2px solid #00ffcc}
#marketTopBar::-webkit-scrollbar{display:none}
.marketBtn{flex-shrink:0;padding:7px 12px;border-radius:20px;border:0;font-size:10px;font-weight:900;cursor:pointer}
.btnMarket{background:#000;color:#00ffcc;border:1px solid #000}
.btnSell{background:#00ffcc;color:#000}
.btnPochi{background:#111;color:#fff;border:1px solid #222;font-size:9px}
.btnFee{background:#fff;color:#000;border:1px solid #222;font-size:9px}
#feed{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;height:100vh;padding-top:76px}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;min-width:100vw;width:100vw;height:calc(100vh - 76px);scroll-snap-align:center;flex-shrink:0;background:#111}
.reel img,.reel video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:0;left:0;right:68px;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.userRow{display:flex;gap:6px;align-items:center;font-weight:800;font-size:12px}
.userRow img{width:28px;height:28px;border-radius:50%;border:2px solid #00ffcc}
.actions{position:absolute;right:4px;bottom:70px;display:flex;flex-direction:column;gap:10px}
.act{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid #555;display:flex;flex-direction:column;align-items:center;justify-content:center}
.act span{font-size:16px}
.act label{font-size:6px;color:#fff}
.act.follow{background:#00ffcc;color:#000;font-weight:900}
/* POPUP */
#marketPopup{position:fixed;top:76px;left:0;right:0;z-index:98;background:#fff;color:#000;display:none;max-height:70vh;overflow:auto;padding:8px;border-bottom:3px solid #00ffcc}
#marketPopup.show{display:block}
  /* === 3X BIGGER TEXT - PASTE THIS === */
header h1{font-size:28px !important}
#marketTopBar{height:78px !important}
.marketBtn{font-size:24px !important; padding:10px 16px !important; font-weight:900 !important}
.btnPochi,.btnFee{font-size:18px !important}
.userRow{font-size:32px !important; font-weight:900 !important}
.userRow img{width:52px !important; height:52px !important}
.cap, .info div{font-size:26px !important; font-weight:700 !important}
.act{width:78px !important; height:78px !important}
.act span{font-size:34px !important}
.act label{font-size:16px !important; font-weight:900 !important}
#feed{padding-top:110px !important}
#marketPopup{top:110px !important}
</style>
</head>
<body>

<header><h1>G-LUMO WORLD 🌍 - 0142550440 Pochi</h1></header>

<!-- THIS WHITE BAR WILL NOW BE VISIBLE - EXACTLY WHERE YOU DREW WHITE RECTANGLE -->
<div id="marketTopBar">
<button class="marketBtn btnMarket" onclick="toggleMarket()">🛒 MARKET BEST</button>
<button class="marketBtn btnSell" onclick="toggleMarket()">+ Sell</button>
<button class="marketBtn btnPochi">Pochi 0142550440</button>
<button class="marketBtn btnFee">Buyer +5% | Seller -5%</button>
<button class="marketBtn btnFee">Fee → 0142550440</button>
<button class="marketBtn btnMarket">Beats All</button>
</div>

<div id="marketPopup">
<div style="display:flex;justify-content:space-between"><b style="font-size:12px">🛒 World Best Market - Pochi 0142550440</b><button onclick="toggleMarket()" style="padding:4px 8px;border-radius:6px;border:0;background:#000;color:#fff;font-size:10px">X Close</button></div>
<div style="margin-top:6px">
<input id="pName" placeholder="Product name" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:11px;margin:3px 0">
<input id="pPrice" type="number" placeholder="Price KSH" oninput="calcFee()" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:11px;margin:3px 0">
<div id="feePreview" style="font-size:10px;color:#00a896;font-weight:800"></div>
<button onclick="addProduct()" style="width:100%;padding:8px;background:#00ffcc;border:0;border-radius:6px;font-weight:900;margin-top:4px">Post to Market</button>
</div>
<div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"></div>
</div>

<div id="feed"></div>

<script>
let openM=false;
function toggleMarket(){openM=!openM;document.getElementById('marketPopup').classList.toggle('show',openM)}
function calcFee(){let p=parseFloat(document.getElementById('pPrice').value)||0;if(!p){document.getElementById('feePreview').innerHTML='';return}document.getElementById('feePreview').innerHTML=`Buyer KSH ${(p*1.05).toFixed(0)} | You get KSH ${(p*0.95).toFixed(0)} | Fee to 0142550440`}

const data=[
{type:'image',src:'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800',user:'@g_lumo',name:'G-LUMO',cap:'CINEMA • Market bar now visible in white top strip'},
{type:'video',src:'https://www.w3schools.com/html/mov_bbb.mp4',user:'@pochi',name:'Pochi 0142550440',cap:'Fee auto to 0142550440'},
{type:'image',src:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=800',user:'@market',name:'Market',cap:'World Best Market'},
{type:'video',src:'https://www.w3schools.com/html/movie.mp4',user:'@seller',name:'Seller',cap:'Sell here'},
{type:'image',src:'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=800',user:'@travel',name:'Travel',cap:'Swipe left right'}
];
let following={};
function render(){
let f=document.getElementById('feed');f.innerHTML='';
data.forEach((d,i)=>{
let m=d.type==='video'?`<video src="${d.src}" loop muted playsinline autoplay></video>`:`<img src="${d.src}">`;
let ft=following[i]?'Following':'Follow';
f.innerHTML+=`<div class="reel">${m}<div class="info"><div class="userRow"><img src="https://i.pravatar.cc/100?img=${i+5}">${d.name} • ${d.user}</div><div style="font-size:11px;margin-top:4px">${d.cap}</div></div><div class="actions"><button class="act follow" onclick="following[${i}]=!following[${i}];render()"><span>👤</span><label>${ft}</label></button><button class="act"><span>❤️</span><label>Like</label></button><button class="act"><span>🔗</span><label>Share</label></button><button class="act"><span>⬇️</span><label>Download</label></button></div></div>`;
});
}
let products=[{name:'Jordan',price:3500,img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300'},{name:'iPhone',price:85000,img:'https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?w=300'}];
function renderMarket(){let g=document.getElementById('grid');g.innerHTML='';products.forEach(p=>{g.innerHTML+=`<div style="border:1px solid #ddd;border-radius:8px;overflow:hidden"><img src="${p.img}" style="width:100%;height:80px;object-fit:cover"><div style="padding:4px"><div style="font-size:10px;font-weight:800">${p.name}</div><div style="font-size:10px;color:#00a896">KSH ${p.price}</div><div style="font-size:8px;color:#888">+5% buyer -5% seller to 0142550440</div></div></div>`})}
function addProduct(){let n=document.getElementById('pName').value.trim();let pr=parseFloat(document.getElementById('pPrice').value);if(!n||!pr)return;products.unshift({name:n,price:pr,img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300'});renderMarket();document.getElementById('pName').value='';document.getElementById('pPrice').value=''}
render();renderMarket();
</script>
</body>
</html>

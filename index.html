<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G-LUMO WORLD - World Beating Editor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:100;background:#000;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #222}
header h1{color:#00ffcc;font-size:18px;font-weight:900}
#marketTopBar{position:fixed;top:40px;left:0;right:0;z-index:99;height:56px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;overflow-x:auto;border-bottom:3px solid #00ffcc}
.marketBtn{flex-shrink:0;padding:8px 14px;border-radius:20px;border:0;font-size:14px;font-weight:900}
.btnMarket{background:#000;color:#00ffcc}.btnSell{background:#00ffcc;color:#000}
#feed{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;height:100vh;padding-top:96px}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;min-width:100vw;width:100vw;height:calc(100vh - 96px);scroll-snap-align:center;flex-shrink:0;background:#111;overflow-y:auto;scroll-snap-type:y mandatory}
.reel::-webkit-scrollbar{display:none}
.reelMedia{position:relative;width:100%;height:100%;scroll-snap-align:start;flex-shrink:0;overflow:hidden}
.reelMedia img,.reelMedia video{width:100%;height:100%;object-fit:cover}
.reelEdit{width:100%;min-height:100%;background:#0a0a0a;scroll-snap-align:start;padding:14px;display:flex;flex-direction:column;gap:12px;border-top:4px solid #00ffcc}
.info{position:absolute;bottom:0;left:0;right:90px;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.9));z-index:5}
.userRow{display:flex;gap:8px;align-items:center;font-size:20px;font-weight:900}
.userRow img{width:44px;height:44px;border-radius:50%;border:2px solid #00ffcc}
.cap{font-size:18px;font-weight:700;margin-top:4px}
.actions{position:absolute;right:6px;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:10}
.actBtn{border:0;background:transparent;cursor:pointer}
.actIcon{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.followBtn{width:60px;height:60px;border-radius:50%;border:3px solid #fff;position:relative;overflow:hidden}
.followPlus{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);background:#ff2d55;width:20px;height:20px;border-radius:50%;color:#fff;font-size:12px;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.editHint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 14px;border-radius:20px;font-size:12px;z-index:6;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
/* EDIT STUDIO - WORLD CLASS */
.toolRow{display:flex;overflow-x:auto;gap:10px;padding:8px 0;scroll-snap-type:x mandatory}
.toolRow::-webkit-scrollbar{display:none}
.filterThumb{flex-shrink:0;width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;scroll-snap-align:start}
.filterThumb div.thumb{width:68px;height:68px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px}
.filterThumb.active div.thumb{border-color:#00ffcc;box-shadow:0 0 10px #00ffcc}
.sliderBox{background:#1a1a1a;border-radius:12px;padding:10px}
.sliderBox input{width:100%}
.canvasBox{position:relative;background:#000;border-radius:12px;overflow:hidden;border:2px solid #222}
.canvasBox canvas{width:100%;max-height:380px;object-fit:contain;display:block}
.editBtn{flex-shrink:0;padding:10px 16px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;font-weight:800;font-size:13px;scroll-snap-align:start}
.editBtn.active{background:#00ffcc;color:#000}
.popup{position:fixed;left:0;right:0;z-index:200;background:#fff;color:#000;display:none;flex-direction:column}
#marketPopup{top:96px;bottom:0;overflow:auto;padding:12px}#marketPopup.show{display:flex}
#sellModal{top:0;bottom:0;overflow:auto;padding:0;background:#f8f8f8;z-index:300}#sellModal.show{display:flex}
#buyModal{bottom:0;max-height:90vh;overflow:auto;border-top:4px solid #00ffcc;border-radius:20px 20px 0 0;padding:16px;z-index:250}#buyModal.show{display:flex}
</style>
</head>
<body>
<header><h1>G-LUMO 🌍 EDIT STUDIO BEATS ALL</h1><button onclick="openSell()" style="padding:6px 12px;background:#00ffcc;border:0;border-radius:20px;font-weight:900;font-size:12px">+ SELL</button></header>
<div id="marketTopBar">
<button class="marketBtn btnMarket" onclick="toggleMarket()">🛒 MARKET 6%→0142550440</button>
<button class="marketBtn btnSell" onclick="openSell()">+ SELL</button>
<button class="marketBtn btnMarket">👇 SCROLL DOWN FOR EDITOR</button>
</div>
<div id="marketPopup" class="popup"><div style="display:flex;justify-content:space-between"><b>🛒 MARKET - 6% auto to 0142550440</b><button onclick="toggleMarket()" style="padding:6px 12px;background:#000;color:#fff;border-radius:8px;border:0">X</button></div><div id="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"></div></div>
<div id="sellModal" class="popup"><div style="background:#000;color:#fff;padding:12px;display:flex;justify-content:space-between"><b>📦 SELL ANYTHING</b><button onclick="closeSell()" style="padding:6px 12px;background:#fff;color:#000;border-radius:8px;border:0">X</button></div><div style="padding:12px;overflow:auto"><input id="pName" placeholder="Title" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px"><textarea id="pDesc" placeholder="Description" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;height:60px"></textarea><div style="display:flex;gap:8px;margin-top:8px"><input id="pPrice" type="number" placeholder="Price you get (94%)" oninput="calcFee()" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:10px"><input id="pImg" placeholder="Image/Video link or upload below" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:10px"></div><div style="display:flex;gap:8px;margin-top:8px"><label style="flex:1;background:#000;color:#00ffcc;padding:12px;border-radius:10px;text-align:center;font-weight:900">📸 Photo<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewSell(this,'image')"></label><label style="flex:1;background:#111;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:900">🎥 Video<input type="file" id="videoInput" accept="video/*" style="display:none" onchange="previewSell(this,'video')"></label></div><div id="sellPreview" style="margin-top:8px"></div><div id="feePreview" style="background:#111;color:#00ffcc;padding:10px;border-radius:8px;margin-top:10px;font-size:12px">Enter price to see 6% auto</div><button onclick="addProduct()" style="width:100%;padding:14px;background:#00ffcc;border:0;border-radius:10px;font-weight:900;margin-top:10px">POST</button></div></div>
<div id="buyModal" class="popup"><div id="buyDetails"></div></div>
<div id="feed"></div>

<script>
let openM=false;function toggleMarket(){openM=!openM;document.getElementById('marketPopup').classList.toggle('show',openM);closeSell()}
function openSell(){document.getElementById('sellModal').classList.add('show')}function closeSell(){document.getElementById('sellModal').classList.remove('show')}
function calcFee(){let p=parseFloat(document.getElementById('pPrice').value)||0;if(!p){document.getElementById('feePreview').innerHTML='Enter price';return}let b=Math.round(p/0.94);document.getElementById('feePreview').innerHTML=`Buyer KSH ${b} | You KSH ${p} | 6% KSH ${b-p} auto to 0142550440`}
let sellTemp=null;
function previewSell(input,type){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=e=>{sellTemp={type:type,src:e.target.result};document.getElementById('sellPreview').innerHTML=type==='image'?`<img src="${e.target.result}" style="width:100%;height:160px;object-fit:cover;border-radius:10px">`:`<video src="${e.target.result}" controls style="width:100%;height:160px;border-radius:10px"></video>`;document.getElementById('pImg').value=e.target.result;};r.readAsDataURL(file);}

const data=[
{type:'image',src:'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800',user:'@g_lumo',name:'G-LUMO',cap:'SCROLL DOWN 👇 For World Class Editor'},
{type:'video',src:'https://www.w3schools.com/html/mov_bbb.mp4',user:'@pochi',name:'Pochi 0142550440',cap:'Video + Photo editor below - Left Right scroll'},
{type:'image',src:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=800',user:'@market',name:'Market',cap:'Edit studio beats CapCut'},
];
let following={},liked={};

function render(){
let f=document.getElementById('feed');f.innerHTML='';
data.forEach((d,i)=>{
let media=d.type==='video'?`<video src="${d.src}" loop muted playsinline autoplay></video>`:`<img src="${d.src}" id="origImg${i}">`;
f.innerHTML+=`<div class="reel" id="reel${i}">
<div class="reelMedia">
${media}
<div class="info"><div class="userRow"><img src="https://i.pravatar.cc/100?img=${i+10}">${d.name} • ${d.user}</div><div class="cap">${d.cap}</div></div>
<div class="actions">
<button class="actBtn" onclick="following[${i}]=!following[${i}];render()"><div class="followBtn"><img src="https://i.pravatar.cc/100?img=${i+10}" style="width:100%;height:100%;object-fit:cover"><div class="followPlus">${following[i]?'✓':'+'}</div></div></button>
<button class="actBtn" onclick="liked[${i}]=!liked[${i}];render()"><div class="actIcon">${liked[i]?'❤️':'🤍'}</div></button>
<button class="actBtn" onclick="openComment(${i})"><div class="actIcon">💬</div></button>
<button class="actBtn" onclick="doShare(${i})"><div class="actIcon">↗️</div></button>
<button class="actBtn" onclick="doDownload(${i})"><div class="actIcon">⬇️</div></button>
</div>
<div class="editHint">👇 SCROLL DOWN FOR EDITOR</div>
</div>
<div class="reelEdit">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#00ffcc">🎨 WORLD CLASS EDIT STUDIO - Beats CapCut, InShot, PicsArt</b><span style="font-size:11px;background:#00ffcc;color:#000;padding:4px 10px;border-radius:20px;font-weight:900">BELOW VIDEO</span></div>

<!-- EDITOR CANVAS -->
<div class="canvasBox">
<canvas id="canvas${i}" width="800" height="800"></canvas>
<img id="editImg${i}" src="${d.src}" style="display:none">
<video id="editVid${i}" src="${d.type==='video'?d.src:''}" style="display:none"></video>
<div id="textOverlay${i}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none;text-align:center"></div>
</div>

<!-- LEFT RIGHT SCROLL - FILTERS -->
<b style="font-size:12px;color:#888">FILTERS - Scroll Left/Right →</b>
<div class="toolRow" id="filters${i}">
${['Original','B&W','Sepia','Vivid','Cold','Warm','Blur','Bright','Dark','Neon'].map((fName,idx)=>`
<div class="filterThumb ${idx===0?'active':''}" onclick="applyFilter(${i},'${fName}',this)">
<div class="thumb" style="background:${idx===0?'#222':`hsl(${idx*30},70%,50%)`}">${['✨','⚫','🟤','🌈','❄️','🔥','💨','☀️','🌙','💡'][idx]}</div>
<span style="font-size:10px">${fName}</span>
</div>`).join('')}
</div>

<!-- LEFT RIGHT SCROLL - ADJUST -->
<b style="font-size:12px;color:#888">ADJUST - Scroll Left/Right →</b>
<div class="toolRow">
<button class="editBtn" onclick="adjust(${i},'brightness',10)">☀️ Bright +</button>
<button class="editBtn" onclick="adjust(${i},'brightness',-10)">☀️ Bright -</button>
<button class="editBtn" onclick="adjust(${i},'contrast',10)">◐ Contrast +</button>
<button class="editBtn" onclick="adjust(${i},'contrast',-10)">◑ Contrast -</button>
<button class="editBtn" onclick="adjust(${i},'saturate',20)">🎨 Color +</button>
<button class="editBtn" onclick="adjust(${i},'saturate',-20)">🎨 Color -</button>
<button class="editBtn" onclick="rotateCanvas(${i},90)">🔄 Rotate 90°</button>
<button class="editBtn" onclick="rotateCanvas(${i},-90)">↩️ Rotate -90°</button>
<button class="editBtn" onclick="flipCanvas(${i})">↔️ Flip</button>
<button class="editBtn" onclick="resetCanvas(${i})">♻️ Reset</button>
</div>

<!-- VIDEO TOOLS -->
${d.type==='video'?`
<b style="font-size:12px;color:#888">VIDEO TOOLS - World Class</b>
<div class="toolRow">
<button class="editBtn" onclick="videoSpeed(${i},0.5)">🐢 0.5x Slow</button>
<button class="editBtn" onclick="videoSpeed(${i},1)">▶️ 1x Normal</button>
<button class="editBtn" onclick="videoSpeed(${i},1.5)">⚡ 1.5x Fast</button>
<button class="editBtn" onclick="videoSpeed(${i},2)">🚀 2x Fast</button>
<button class="editBtn" onclick="toggleMute(${i})">🔇 Mute/Unmute</button>
<button class="editBtn" onclick="captureFrame(${i})">📸 Capture Frame</button>
</div>
`:''}

<!-- TEXT & STICKERS - LEFT RIGHT SCROLL -->
<b style="font-size:12px;color:#888">TEXT & STICKERS - Scroll →</b>
<div class="toolRow">
<button class="editBtn" onclick="addText(${i},'G-LUMO WORLD 🌍')">🌍 Add Text</button>
<button class="editBtn" onclick="addText(${i},'🔥 FIRE')">🔥 FIRE</button>
<button class="editBtn" onclick="addText(${i},'❤️ LOVE')">❤️ LOVE</button>
<button class="editBtn" onclick="addText(${i},'💰 MONEY')">💰 MONEY</button>
<button class="editBtn" onclick="addSticker(${i},'😎')">😎</button>
<button class="editBtn" onclick="addSticker(${i},'🔥')">🔥</button>
<button class="editBtn" onclick="addSticker(${i},'💎')">💎</button>
<button class="editBtn" onclick="addSticker(${i},'👑')">👑</button>
<button class="editBtn" onclick="addSticker(${i},'🚀')">🚀</button>
<button class="editBtn" onclick="addSticker(${i},'✨')">✨</button>
<button class="editBtn" onclick="clearText(${i})">🧹 Clear Text</button>
</div>

<div style="display:flex;gap:8px;margin-top:8px">
<button onclick="downloadEdited(${i})" style="flex:1;padding:14px;background:#00ffcc;color:#000;border:0;border-radius:10px;font-weight:900">⬇️ DOWNLOAD EDITED</button>
<button onclick="postEdited(${i})" style="flex:1;padding:14px;background:#fff;color:#000;border:0;border-radius:10px;font-weight:900">📤 POST EDITED</button>
</div>

<div style="font-size:10px;color:#666;text-align:center;margin-top:6px">Scroll up to see original video • Scroll left/right on tools • World Class Editor beats CapCut</div>
</div>
</div>`;
});
setTimeout(initCanvases,300);
}

let canvasState={};
function initCanvases(){
 data.forEach((d,i)=>{
  let canvas=document.getElementById(`canvas${i}`);
  if(!canvas) return;
  let ctx=canvas.getContext('2d');
  let img=document.getElementById(`editImg${i}`);
  if(img){img.onload=()=>{ctx.drawImage(img,0,0,canvas.width,canvas.height);canvasState[i]={brightness:100,contrast:100,saturate:100,rotate:0,filter:'Original'}}; if(img.complete){ctx.drawImage(img,0,0,canvas.width,canvas.height);canvasState[i]={brightness:100,contrast:100,saturate:100,rotate:0,filter:'Original'}}}
  if(d.type==='video'){let v=document.getElementById(`editVid${i}`);v.addEventListener('play',()=>{drawVideoToCanvas(i)})}
 });
}
function drawVideoToCanvas(i){
 let canvas=document.getElementById(`canvas${i}`);let video=document.getElementById(`editVid${i}`);if(!canvas||!video)return;let ctx=canvas.getContext('2d');
 function loop(){if(video.paused||video.ended)return;ctx.drawImage(video,0,0,canvas.width,canvas.height);requestAnimationFrame(loop)}loop();
}
function applyFilter(i,name,el){
 document.querySelectorAll(`#filters${i} .filterThumb`).forEach(e=>e.classList.remove('active'));if(el)el.classList.add('active');
 let canvas=document.getElementById(`canvas${i}`);let ctx=canvas.getContext('2d');
 let img=document.getElementById(`editImg${i}`);
 if(!canvasState[i])canvasState[i]={brightness:100,contrast:100,saturate:100,rotate:0};
 canvasState[i].filter=name;
 ctx.filter='none';ctx.clearRect(0,0,canvas.width,canvas.height);
 if(name==='Original') ctx.filter='none';
 if(name==='B&W') ctx.filter='grayscale(100%)';
 if(name==='Sepia') ctx.filter='sepia(100%)';
 if(name==='Vivid') ctx.filter='saturate(200%) contrast(120%)';
 if(name==='Cold') ctx.filter='hue-rotate(180deg) saturate(120%)';
 if(name==='Warm') ctx.filter='sepia(40%) saturate(150%)';
 if(name==='Blur') ctx.filter='blur(4px)';
 if(name==='Bright') ctx.filter='brightness(150%)';
 if(name==='Dark') ctx.filter='brightness(60%)';
 if(name==='Neon') ctx.filter='contrast(200%) saturate(300%) hue-rotate(90deg)';
 // redraw
 let b=canvasState[i].brightness, c=canvasState[i].contrast, s=canvasState[i].saturate;
 ctx.filter+=` brightness(${b}%) contrast(${c}%) saturate(${s}%)`;
 if(img && img.src){ctx.drawImage(img,0,0,canvas.width,canvas.height)}else{let v=document.getElementById(`editVid${i}`);if(v)ctx.drawImage(v,0,0,canvas.width,canvas.height)}
}
function adjust(i,type,val){
 if(!canvasState[i])canvasState[i]={brightness:100,contrast:100,saturate:100,rotate:0,filter:'Original'};
 if(type==='brightness')canvasState[i].brightness+=val;
 if(type==='contrast')canvasState[i].contrast+=val;
 if(type==='saturate')canvasState[i].saturate+=val;
 applyFilter(i,canvasState[i].filter,null);
}
function rotateCanvas(i,deg){if(!canvasState[i])canvasState[i]={brightness:100,contrast:100,saturate:100,rotate:0,filter:'Original'};canvasState[i].rotate+=deg;let

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-LUMO</title>
<style>
body{background:#0f0f1a;color:#fff;margin:0;padding:15px;font-family:Arial;text-align:center;overflow-y:auto !important;height:auto !important;min-height:100vh}
html{overflow-y:auto !important}
button{background:#00ffcc;border:0;padding:12px;border-radius:20px;font-weight:bold;width:100%;margin:5px 0}
input{width:100%;padding:12px;border-radius:8px;border:0;margin:8px 0;box-sizing:border-box}
#reels{display:flex;gap:12px;overflow-x:auto;padding:15px 0}
.reel{min-width:85%;background:#000;border:1px solid #333;border-radius:14px;padding:0;overflow:hidden;height:400px;position:relative}
.reel video{width:100%;height:100%;object-fit:cover}
.cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,black);padding:12px;text-align:left}
</style>
</head>
<body>
<h1 style="color:#00ffcc">G-LUMO</h1>
<p>Connect. Share. Glow.</p>
<input id="postText" placeholder="What's happening in Sosiot?">
<button onclick="addPost()">Post</button>
<button onclick="share()" style="background:#fff;color:#000">Share G-LUMO</button>

<div id="feed"></div>

<div style="background:#1a1a2e;padding:12px;border-radius:12px;margin-top:15px;text-align:left">
<h3 style="color:#00ffcc;margin:0">G-LUMO Reels - Friends Only</h3>
<p style="font-size:12px;color:#aaa">Swipe left/right - NO YouTube</p>
<div id="reels"></div>
</div>

<script>
function share(){ 
  if(navigator.share){navigator.share({title:'G-LUMO',url:location.href})} else {alert(location.href)} 
}

var reels = [
  {user:'@mary_salon', text:'Salon vibes Sosiot', likes:24},
  {user:'@brian_boda', text:'Kericho ride today', likes:18},
  {user:'@faith_254', text:'New dance challenge', likes:56}
];

function render(){
  var box = document.getElementById('reels');
  box.innerHTML = '';
  for(var i=0;i<reels.length;i++){
    var r = reels[i];
    var d = document.createElement('div');
    d.className = 'reel';
    d.innerHTML = '<div style="height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-size:50px">🎬</div><div class="cap"><b style="color:#00ffcc">'+r.user+'</b><br>'+r.text+'<br>❤️ '+r.likes+'</div>';
    box.appendChild(d);
  }
  var f = document.getElementById('feed');
  f.innerHTML = '';
  for(var j=0;j<reels.length;j++){
    var p = document.createElement('div');
    p.style.cssText='background:#111827;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0;text-align:left';
    p.innerHTML = '<b>'+reels[j].user+'</b><br>'+reels[j].text;
    f.appendChild(p);
  }
}

function addPost(){
  var inp = document.getElementById('postText');
  if(!inp.value) return;
  reels.unshift({user:'@you', text:inp.value, likes:0});
  inp.value='';
  render();
}

render();
document.body.style.overflow='auto';
</script>
</body>
</html>
